<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miuh AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    color:white;
    background:
      radial-gradient(circle at center,#43000f,transparent 40%),
      linear-gradient(135deg,#020204,#100006,#020204);
}

.logo{
    position:fixed;
    top:25px;
    left:30px;
    display:flex;
    align-items:center;
    gap:9px;
    font-size:22px;
    font-weight:bold;
}

.logo-icon{
    width:38px;
    height:26px;
    background:#ff0033;
    border-radius:7px;
    position:relative;
}

.logo-icon:after{
    content:"";
    position:absolute;
    left:14px;
    top:6px;
    border-left:11px solid white;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
}

.brand{
    position:fixed;
    top:27px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
}

.brand span{
    color:#ff1744;
}

.main{
    display:flex;
    align-items:center;
    gap:70px;
}

.voice{
    width:320px;
    height:320px;
    position:relative;
    display:grid;
    place-items:center;
}

.ring{
    position:absolute;
    border:1px solid #ff174455;
    border-radius:50%;
    animation:pulse 2s infinite;
}

.r1{width:320px;height:320px}
.r2{width:265px;height:265px;animation-delay:.3s}
.r3{width:215px;height:215px;animation-delay:.6s}

#mic{
    width:135px;
    height:135px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    background:radial-gradient(circle at 35% 25%,#ff92a4,#ff1744 55%,#650016);
    box-shadow:0 0 35px #ff174477;
    z-index:2;
    transition:.2s;
}

#mic:hover{
    transform:scale(1.07);
    box-shadow:0 0 55px #ff1744cc;
}

.mic-icon{
    width:60px;
    height:60px;
}

.listening{
    animation:listen 1s infinite;
}

.player{
    display:none;
    width:500px;
}

.player iframe{
    width:100%;
    height:280px;
    border:1px solid #ff174455;
    border-radius:16px;
    background:#000;
    box-shadow:0 0 30px #ff174422;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        opacity:.7
    }
}

@keyframes listen{
    50%{
        box-shadow:0 0 70px #ff1744
    }
}

@media(max-width:900px){
    .main{
        flex-direction:column;
        gap:20px;
    }

    .player{
        width:90vw;
    }

    .player iframe{
        height:230px;
    }
}
</style>
</head>

<body>

<div class="logo">
    <div class="logo-icon"></div>
    YouTube
</div>

<div class="brand">
    Miuh <span>AI</span>
</div>

<div id="main" class="main">

    <div id="voice" class="voice">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <button id="mic" aria-label="Start voice search">

            <svg class="mic-icon"
                 viewBox="0 0 24 24"
                 fill="none">

                <rect x="8" y="2"
                      width="8"
                      height="13"
                      rx="4"
                      fill="white"/>

                <path d="M5 11C5 15 8 18 12 18C16 18 19 15 19 11"
                      stroke="white"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <path d="M12 18V22"
                      stroke="white"
                      stroke-width="2"
                      stroke-linecap="round"/>

                <path d="M9 22H15"
                      stroke="white"
                      stroke-width="2"
                      stroke-linecap="round"/>

            </svg>

        </button>

    </div>

    <div id="player" class="player">

        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

    </div>

</div>

<script>
const mic=document.getElementById("mic");
const voice=document.getElementById("voice");
const player=document.getElementById("player");
const youtubePlayer=document.getElementById("youtubePlayer");

const SpeechRecognition=
    window.SpeechRecognition||
    window.webkitSpeechRecognition;

if(!SpeechRecognition){
    mic.disabled=true;
    console.error("Speech recognition not supported");
}else{

    const recognition=new SpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    mic.onclick=()=>{
        try{
            recognition.start();
            voice.classList.add("listening");
        }catch(error){
            console.error(error);
        }
    };

    recognition.onresult=async event=>{

        const command=
            event.results[0][0].transcript.trim();

        try{

            const response=await fetch("/youtube/play",{
                method:"POST",
                headers:{
                    "Content-Type":"application/json"
                },
                body:JSON.stringify({
                    command:command
                })
            });

            const data=await response.json();

            if(!response.ok||!data.success){
                console.error(
                    data.message||"Song not found"
                );
                return;
            }

            youtubePlayer.src=data.url;
            player.style.display="block";

            voice.style.transform="translateX(-250px)";

        }catch(error){
            console.error("Backend error:",error);
        }
    };

    recognition.onerror=event=>{
        console.error("Mic error:",event.error);
        voice.classList.remove("listening");
    };

    recognition.onend=()=>{
        voice.classList.remove("listening");
    };
}
</script>

</body>
</html>
