<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nova AI</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: grid;
    place-items: center;
    background: linear-gradient(135deg, #0a0a0f, #1a1a2e);
    color: #e0e0ff;
    font-family: 'Segoe UI', sans-serif;
}

.card {
    width: 340px;
    padding: 40px;
    text-align: center;
    background: rgba(25, 25, 40, 0.85);
    border: 1px solid #444;
    border-radius: 20px;
    backdrop-filter: blur(12px);
    box-shadow: 0 0 25px rgba(0, 200, 255, 0.3);
    transition: transform 0.3s ease;
}
.card:hover {
    transform: translateY(-5px);
}

h2 {
    font-size: 26px;
    margin-bottom: 10px;
    background: linear-gradient(90deg, #00f0ff, #ff00ff);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    font-size: 14px;
    color: #bbb;
}

.mic {
    width: 100px;
    height: 100px;
    border: none;
    border-radius: 50%;
    font-size: 40px;
    cursor: pointer;
    background: linear-gradient(135deg, #00f0ff, #ff00ff);
    color: #fff;
    box-shadow: 0 0 20px rgba(0, 200, 255, 0.6);
    transition: transform 0.2s ease, box-shadow 0.3s ease;
}
.mic:hover {
    transform: scale(1.1);
    box-shadow: 0 0 30px rgba(255, 0, 255, 0.7);
}

.status {
    margin-top: 20px;
    font-size: 14px;
    color: #88f;
    letter-spacing: 1px;
}

.song {
    margin-top: 15px;
    font-size: 14px;
    color: #fff;
    background: linear-gradient(90deg, #00f0ff, #ff00ff);
    padding: 8px 12px;
    border-radius: 12px;
    overflow: hidden;
    white-space: nowrap;
    animation: ticker 8s linear infinite;
}

.listening {
    animation: pulse 1.2s infinite;
}

@keyframes pulse {
    0% { box-shadow: 0 0 15px rgba(0, 200, 255, 0.6); }
    50% { box-shadow: 0 0 35px rgba(255, 0, 255, 0.8); }
    100% { box-shadow: 0 0 15px rgba(0, 200, 255, 0.6); }
}

@keyframes ticker {
    0% { transform: translateX(100%); }
    100% { transform: translateX(-100%); }
}
</style>
</head>

<body>

<div class="card">

    <h2>Nova AI</h2>
    <p>Say a song name</p>

    <button id="mic" class="mic">🎙️</button>

    <div id="status" class="status">Tap microphone</div>
    <div id="song" class="song"></div>

</div>

<script>
// Your existing JavaScript logic stays the same
</script>

</body>
</html>
