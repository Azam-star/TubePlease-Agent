<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Nova AI</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    min-height: 100vh;
    overflow: hidden;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Segoe UI", Arial, sans-serif;
    color: white;

    background:
        radial-gradient(circle at 50% 45%, rgba(255, 0, 55, 0.18), transparent 30%),
        radial-gradient(circle at 15% 20%, rgba(255, 0, 0, 0.12), transparent 25%),
        radial-gradient(circle at 85% 80%, rgba(255, 0, 80, 0.10), transparent 25%),
        linear-gradient(135deg, #050505 0%, #0c0c10 45%, #080808 100%);
}

/* Ambient background glow */
body::before {
    content: "";
    position: fixed;
    width: 700px;
    height: 700px;
    border-radius: 50%;
    background: rgba(255, 0, 50, 0.08);
    filter: blur(120px);
    z-index: -2;
}

/* Decorative YouTube-style light */
body::after {
    content: "";
    position: fixed;
    width: 100%;
    height: 100%;
    background:
        linear-gradient(
            120deg,
            transparent 40%,
            rgba(255, 0, 50, 0.035) 50%,
            transparent 60%
        );
    z-index: -1;
}

/* Main card */
.card {
    position: relative;
    width: 380px;
    padding: 45px 40px;
    text-align: center;

    background: rgba(18, 18, 22, 0.82);
    border: 1px solid rgba(255, 255, 255, 0.10);
    border-radius: 28px;

    backdrop-filter: blur(25px);

    box-shadow:
        0 0 50px rgba(255, 0, 40, 0.12),
        0 25px 80px rgba(0, 0, 0, 0.65);

    z-index: 2;
}

/* Small YouTube badge */
.youtube-badge {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 15px;

    font-size: 13px;
    font-weight: 600;
    color: #aaa;
    letter-spacing: 0.5px;
}

.youtube-icon {
    width: 28px;
    height: 20px;
    border-radius: 6px;
    background: #ff0033;
    position: relative;
}

.youtube-icon::after {
    content: "";
    position: absolute;
    left: 11px;
    top: 5px;

    border-left: 8px solid white;
    border-top: 5px solid transparent;
    border-bottom: 5px solid transparent;
}

/* Title */
h2 {
    margin: 0;
    font-size: 42px;
    font-weight: 700;
    letter-spacing: -1px;

    background: linear-gradient(
        90deg,
        #ffffff,
        #ff405c,
        #ff0033
    );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

.subtitle {
    margin-top: 10px;
    font-size: 15px;
    color: #a9a9b2;
}

/* Microphone */
.mic {
    width: 130px;
    height: 130px;
    margin-top: 30px;

    border: 0;
    border-radius: 50%;

    font-size: 48px;
    cursor: pointer;

    color: white;

    background:
        radial-gradient(
            circle at 35% 30%,
            #ff596f,
            #ff0033 55%,
            #b40023
        );

    box-shadow:
        0 0 0 8px rgba(255, 0, 50, 0.08),
        0 0 35px rgba(255, 0, 50, 0.45),
        inset 0 0 25px rgba(255, 255, 255, 0.10);

    transition:
        transform 0.25s ease,
        box-shadow 0.25s ease;
}

.mic:hover {
    transform: scale(1.07);

    box-shadow:
        0 0 0 12px rgba(255, 0, 50, 0.08),
        0 0 55px rgba(255, 0, 50, 0.65),
        inset 0 0 25px rgba(255, 255, 255, 0.15);
}

.mic:active {
    transform: scale(0.96);
}

/* Listening animation */
.listening {
    animation: listeningPulse 1.1s infinite;
}

@keyframes listeningPulse {
    0% {
        box-shadow:
            0 0 0 8px rgba(255, 0, 50, 0.08),
            0 0 30px rgba(255, 0, 50, 0.4);
    }

    50% {
        box-shadow:
            0 0 0 18px rgba(255, 0, 50, 0.05),
            0 0 70px rgba(255, 0, 50, 0.85);
    }

    100% {
        box-shadow:
            0 0 0 8px rgba(255, 0, 50, 0.08),
            0 0 30px rgba(255, 0, 50, 0.4);
    }
}

/* Status */
.status {
    margin-top: 24px;
    color: #d0d0d5;
    font-size: 14px;
    letter-spacing: 0.5px;
}

/* Song result */
.song {
    margin-top: 18px;
    min-height: 42px;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 10px 14px;

    border-radius: 14px;

    background: rgba(255, 255, 255, 0.05);
    border: 1px solid rgba(255, 255, 255, 0.08);

    color: white;
    font-size: 14px;
}

/* Bottom tagline */
.tagline {
    margin-top: 28px;
    font-size: 12px;
    color: #777;
    letter-spacing: 1px;
}

/* Decorative music waves */
.wave {
    position: fixed;
    bottom: 30px;
    width: 100%;
    height: 80px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 5px;

    opacity: 0.35;
    z-index: 0;
}

.wave span {
    width: 3px;
    height: 20px;
    border-radius: 5px;

    background: #ff0033;

    animation: wave 1.2s ease-in-out infinite;
}

.wave span:nth-child(2) { animation-delay: .1s; }
.wave span:nth-child(3) { animation-delay: .2s; }
.wave span:nth-child(4) { animation-delay: .3s; }
.wave span:nth-child(5) { animation-delay: .4s; }
.wave span:nth-child(6) { animation-delay: .5s; }
.wave span:nth-child(7) { animation-delay: .6s; }
.wave span:nth-child(8) { animation-delay: .7s; }
.wave span:nth-child(9) { animation-delay: .8s; }

@keyframes wave {
    0%, 100% {
        height: 15px;
    }

    50% {
        height: 55px;
    }
}
</style>
</head>

<body>

<div class="card">

    <h2>Nova AI</h2>

    <p>Say a song name</p>

    <button id="mic" class="mic">🎙️</button>

    <div id="status" class="status">
        Tap microphone
    </div>

    <div id="song" class="song"></div>

    <div id="player" class="player">
        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>

</div>


<script>

const mic = document.getElementById("mic");
const status = document.getElementById("status");
const song = document.getElementById("song");

const player = document.getElementById("player");
const youtubePlayer = document.getElementById("youtubePlayer");


// Check browser speech recognition support
const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (!SpeechRecognition) {

    status.textContent =
        "Speech recognition is not supported";

    mic.disabled = true;

} else {

    const recognition = new SpeechRecognition();

    recognition.lang = "en-US";

    recognition.continuous = false;

    recognition.interimResults = false;


    // MICROPHONE BUTTON
    mic.addEventListener("click", () => {

        try {

            recognition.start();

            mic.classList.add("listening");

            status.textContent = "Listening...";

            song.textContent = "";

        } catch (error) {

            console.error(error);

        }

    });


    // SPEECH RESULT
    recognition.onresult = async (event) => {

        const command =
            event.results[0][0].transcript.trim();


        console.log("Recognized:", command);


        status.textContent = "Searching...";

        song.textContent = command;


        try {

            const response = await fetch(
                "/youtube/play",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({
                        command: command
                    })
                }
            );


            const data = await response.json();


            console.log("Backend:", data);


            if (!response.ok || !data.success) {

                status.textContent =
                    data.message ||
                    "Song not found";

                return;
            }


            // SONG FOUND
            status.textContent =
                "Playing: " + data.query;


            song.textContent =
                data.query;


            // LOAD YOUTUBE
            youtubePlayer.src = data.url;

            player.style.display = "block";


        } catch (error) {

            console.error(
                "Backend error:",
                error
            );

            status.textContent =
                "Could not connect to server";
        }
    };


    // SPEECH ERROR
    recognition.onerror = (event) => {

        console.error(
            "Speech error:",
            event.error
        );


        if (event.error === "not-allowed") {

            status.textContent =
                "Microphone permission denied";

        } else if (event.error === "no-speech") {

            status.textContent =
                "Didn't hear anything";

        } else {

            status.textContent =
                "Microphone error: " +
                event.error;
        }


        mic.classList.remove("listening");
    };


    // SPEECH ENDED
    recognition.onend = () => {

        mic.classList.remove("listening");

    };

}

</script>

</body>
</html>
