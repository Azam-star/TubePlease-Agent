<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miuh AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            position: relative;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at center,
                    rgba(255, 0, 45, 0.18),
                    transparent 38%
                ),
                radial-gradient(
                    circle at 15% 50%,
                    rgba(120, 0, 20, 0.16),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 85% 50%,
                    rgba(120, 0, 20, 0.16),
                    transparent 35%
                ),
                #020203;

            font-family: "Segoe UI", Arial, sans-serif;
        }

        /* Background image */
        .background-art {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: min(1200px, 100vw);
            height: auto;

            opacity: 0.95;

            object-fit: contain;

            z-index: 0;

            user-select: none;
            pointer-events: none;

            filter:
                brightness(0.78)
                contrast(1.12)
                saturate(1.15);
        }

        /* Dark overlay */
        .overlay {
            position: fixed;
            inset: 0;

            background:
                radial-gradient(
                    circle at center,
                    transparent 10%,
                    rgba(0, 0, 0, 0.15) 55%,
                    rgba(0, 0, 0, 0.55) 100%
                );

            z-index: 1;

            pointer-events: none;
        }

        /* YouTube logo */
        .youtube-logo {
            position: fixed;

            top: 28px;
            left: 32px;

            display: flex;
            align-items: center;
            gap: 10px;

            color: white;

            font-size: 23px;
            font-weight: 700;

            z-index: 10;
        }

        .youtube-icon {
            width: 39px;
            height: 27px;

            position: relative;

            border-radius: 8px;

            background: #ff0033;

            box-shadow:
                0 0 22px rgba(255, 0, 45, 0.35);
        }

        .youtube-icon::after {
            content: "";

            position: absolute;

            left: 15px;
            top: 7px;

            border-left: 11px solid white;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
        }

        /* Miuh AI label */
        .brand {
            position: fixed;

            top: 30px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            font-size: 20px;
            font-weight: 700;
            letter-spacing: 1px;

            color: white;

            text-shadow:
                0 0 15px rgba(255, 0, 45, 0.35);
        }

        .brand span {
            color: #ff1744;
        }

        /* Clickable microphone area */
        .voice-button {
            position: fixed;

            left: 50%;
            top: 50%;

            transform: translate(-50%, -50%);

            width: 170px;
            height: 170px;

            border: none;
            border-radius: 50%;

            background: transparent;

            cursor: pointer;

            z-index: 5;

            outline: none;

            transition:
                transform 0.2s ease,
                box-shadow 0.3s ease;
        }

        .voice-button:hover {
            transform:
                translate(-50%, -50%)
                scale(1.06);
        }

        .voice-button:active {
            transform:
                translate(-50%, -50%)
                scale(0.96);
        }

        /* Subtle clickable glow */
        .voice-button::before {
            content: "";

            position: absolute;
            inset: 5px;

            border-radius: 50%;

            box-shadow:
                0 0 35px rgba(255, 0, 45, 0.05);

            transition: box-shadow 0.3s ease;
        }

        .voice-button:hover::before {
            box-shadow:
                0 0 50px rgba(255, 0, 45, 0.25);
        }

        /* Listening state */
        .voice-button.listening::before {
            animation: micPulse 1.1s infinite;
        }

        @keyframes micPulse {

            0% {
                box-shadow:
                    0 0 0 0
                    rgba(255, 0, 50, 0.55);
            }

            50% {
                box-shadow:
                    0 0 0 25px
                    rgba(255, 0, 50, 0.08);
            }

            100% {
                box-shadow:
                    0 0 0 55px
                    rgba(255, 0, 50, 0);
            }
        }

        /* Hidden functional elements */
        #status,
        #song,
        #player {
            display: none;
        }

        /* Small red bottom glow */
        .bottom-glow {
            position: fixed;

            left: 50%;
            bottom: -130px;

            transform: translateX(-50%);

            width: 850px;
            height: 240px;

            border-radius: 50%;

            background:
                radial-gradient(
                    ellipse,
                    rgba(255, 0, 45, 0.18),
                    transparent 70%
                );

            filter: blur(30px);

            pointer-events: none;

            z-index: 1;
        }

        /* Mobile */
        @media (max-width: 600px) {

            .youtube-logo {
                top: 20px;
                left: 20px;
                font-size: 20px;
            }

            .youtube-icon {
                width: 34px;
                height: 24px;
            }

            .brand {
                top: 23px;
                font-size: 17px;
            }

            .background-art {
                width: 150vw;
                max-width: none;
            }

            .voice-button {
                width: 130px;
                height: 130px;
            }
        }
    </style>
</head>


<body>

    <!-- Your red/black orb image -->
    <img
        class="background-art"
        src="{{ url_for('static', filename='images/miuh-orb.png') }}"
        alt=""
    >

    <div class="overlay"></div>

    <!-- YouTube logo -->
    <div class="youtube-logo">
        <div class="youtube-icon"></div>
        <span>YouTube</span>
    </div>

    <!-- Miuh AI -->
    <div class="brand">
        Miuh <span>AI</span>
    </div>

    <!-- Clickable microphone -->
    <button
        id="mic"
        class="voice-button"
        aria-label="Start voice search">
    </button>

    <!-- Functional elements -->
    <div id="status">Tap microphone</div>

    <div id="song"></div>

    <div id="player">
        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>
    </div>

    <div class="bottom-glow"></div>


    <script>

        const mic =
            document.getElementById("mic");

        const status =
            document.getElementById("status");

        const song =
            document.getElementById("song");


        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            console.error(
                "Speech recognition is not supported."
            );

        } else {

            const recognition =
                new SpeechRecognition();

            recognition.lang = "en-US";

            recognition.continuous = false;

            recognition.interimResults = false;


            /* MICROPHONE */
            mic.addEventListener(
                "click",
                () => {

                    try {

                        recognition.start();

                        mic.classList.add(
                            "listening"
                        );

                        console.log(
                            "Listening..."
                        );

                    } catch (error) {

                        console.error(error);

                    }
                }
            );


            /* SPEECH RESULT */
            recognition.onresult =
                async (event) => {

                    const command =
                        event.results[0][0]
                            .transcript
                            .trim();


                    console.log(
                        "Recognized:",
                        command
                    );


                    try {

                        const response =
                            await fetch(
                                "/youtube/play",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            command:
                                                command
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        console.log(
                            "Backend:",
                            data
                        );


                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            console.error(
                                data.message ||
                                "Song not found"
                            );

                            return;
                        }


                        /*
                         * Convert:
                         *
                         * /embed/VIDEO_ID
                         *
                         * into:
                         *
                         * /watch?v=VIDEO_ID
                         */

                        const youtubeUrl =
                            data.url.replace(
                                "https://www.youtube.com/embed/",
                                "https://www.youtube.com/watch?v="
                            );


                        /* OPEN YOUTUBE */
                        window.open(
                            youtubeUrl,
                            "_blank"
                        );

                    } catch (error) {

                        console.error(
                            "Backend error:",
                            error
                        );

                    }
                };


            /* ERROR */
            recognition.onerror =
                (event) => {

                    console.error(
                        "Speech error:",
                        event.error
                    );

                    mic.classList.remove(
                        "listening"
                    );
                };


            /* END */
            recognition.onend =
                () => {

                    mic.classList.remove(
                        "listening"
                    );

                };
        }

    </script>

</body>

</html>
