<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miuh AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    color:white;
    background:
        radial-gradient(circle at 50% 45%,#4a0013,transparent 35%),
        radial-gradient(circle at 85% 20%,#3b002d,transparent 25%),
        radial-gradient(circle at 15% 80%,#26000d,transparent 28%),
        linear-gradient(135deg,#010102,#0d0208,#020203);
}

/* YouTube */

.youtube{
    position:fixed;
    top:25px;
    left:30px;

    display:flex;
    align-items:center;
    gap:9px;

    font-size:22px;
    font-weight:bold;
    z-index:10;
}

.youtube-icon{
    width:38px;
    height:26px;
    background:#ff0033;
    border-radius:7px;
    position:relative;
    box-shadow:0 0 18px #ff003355;
}

.youtube-icon:after{
    content:"";
    position:absolute;
    left:14px;
    top:6px;
    border-left:11px solid white;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
}

/* Gmail */

.gmail{
    position:fixed;
    top:25px;
    right:30px;

    display:flex;
    align-items:center;
    gap:9px;

    font-size:22px;
    font-weight:bold;

    z-index:10;
}

.gmail-icon{
    width:38px;
    height:28px;

    position:relative;

    border-radius:6px;

    background:#fff;

    overflow:hidden;

    box-shadow:0 0 18px #ff3b5d33;
}

.gmail-icon:before{
    content:"";

    position:absolute;
    left:0;
    top:0;

    width:100%;
    height:100%;

    background:
        linear-gradient(
            145deg,
            transparent 43%,
            #ea4335 44%,
            #ea4335 51%,
            transparent 52%
        ),
        linear-gradient(
            215deg,
            transparent 43%,
            #c5221f 44%,
            #c5221f 51%,
            transparent 52%
        );
}

.gmail-icon:after{
    content:"";

    position:absolute;

    left:0;
    right:0;
    top:0;

    height:8px;

    background:#ea4335;
}

/* Miuh AI */

.brand{
    position:fixed;
    top:27px;
    left:50%;

    transform:translateX(-50%);

    font-size:22px;
    font-weight:bold;

    z-index:10;

    text-shadow:0 0 18px #ff174433;
}

.brand span{
    color:#ff1744;
}

/* Main */

.main{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:70px;
    transition:.5s;
}

/* Mic */

.voice{
    width:320px;
    height:320px;

    position:relative;

    display:grid;
    place-items:center;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            rgba(55,0,12,.45),
            rgba(5,0,4,.9)
        );

    box-shadow:
        0 0 35px rgba(255,0,45,.25),
        0 0 80px rgba(255,0,45,.10);

    transition:.5s;
}

.ring{
    position:absolute;

    border:1px solid #ff174455;

    border-radius:50%;

    animation:pulse 2s infinite;

    pointer-events:none;
}

.r1{
    width:300px;
    height:300px;
}

.r2{
    width:250px;
    height:250px;

    animation-delay:.3s;
}

.r3{
    width:200px;
    height:200px;

    animation-delay:.6s;
}

#mic{
    width:135px;
    height:135px;

    border:0;
    border-radius:50%;

    cursor:pointer;

    display:grid;
    place-items:center;

    background:
        radial-gradient(
            circle at 35% 25%,
            #ff92a4,
            #ff1744 55%,
            #650016
        );

    box-shadow:0 0 35px #ff174477;

    z-index:2;

    transition:.2s;
}

#mic:hover{
    transform:scale(1.07);
    box-shadow:0 0 55px #ff1744cc;
}

#mic.listening{
    animation:listen 1s infinite;
}

.mic-icon{
    width:60px;
    height:60px;
}

/* Video */

.player{
    display:none;
    width:500px;
}

.player iframe{
    width:100%;
    height:280px;

    border:1px solid #ff174455;
    border-radius:16px;

    background:#000;

    box-shadow:0 0 30px #ff174422;
}

/* Animations */

@keyframes pulse{
    50%{
        transform:scale(1.08);
        opacity:.65;
    }
}

@keyframes listen{
    50%{
        box-shadow:
            0 0 0 15px #ff174422,
            0 0 70px #ff1744;
    }
}

/* Mobile */

@media(max-width:900px){

    body{
        overflow:auto;
    }

    .main{
        flex-direction:column;
        gap:20px;
    }

    .voice{
        width:300px;
        height:300px;
    }

    .r1{
        width:280px;
        height:280px;
    }

    .r2{
        width:235px;
        height:235px;
    }

    .r3{
        width:190px;
        height:190px;
    }

    .player{
        width:90vw;
    }

    .player iframe{
        height:230px;
    }

    .youtube,
    .gmail{
        font-size:18px;
    }

    .youtube{
        left:15px;
    }

    .gmail{
        right:15px;
    }
}
</style>
</head>

<body>

<div class="youtube">
    <div class="youtube-icon"></div>
    YouTube
</div>

<div class="brand">
    Miuh <span>AI</span>
</div>

<div class="gmail">
    <div class="gmail-icon"></div>
    Gmail
</div>

<div id="main" class="main">

    <div id="voice" class="voice">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <button id="mic" aria-label="Start voice search">

            <svg
                class="mic-icon"
                viewBox="0 0 24 24"
                fill="none"
                xmlns="http://www.w3.org/2000/svg">

                <rect
                    x="8"
                    y="2"
                    width="8"
                    height="13"
                    rx="4"
                    fill="white"/>

                <path
                    d="M5 11C5 15 8 18 12 18C16 18 19 15 19 11"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M12 18V22"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M9 22H15"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>

        </button>

    </div>

    <div id="player" class="player">

        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

    </div>

</div>

<script>

const mic =
    document.getElementById("mic");

const voice =
    document.getElementById("voice");

const player =
    document.getElementById("player");

const youtubePlayer =
    document.getElementById("youtubePlayer");

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

if(!SpeechRecognition){

    mic.disabled=true;

    console.error(
        "Speech recognition not supported"
    );

}else{

    const recognition =
        new SpeechRecognition();

    recognition.lang="en-US";
    recognition.continuous=false;
    recognition.interimResults=false;

    mic.onclick=()=>{

        try{

            recognition.start();

            mic.classList.add("listening");

        }catch(error){

            console.error(error);

        }
    };

    recognition.onresult=async event=>{

        const command =
            event.results[0][0]
            .transcript
            .trim();

        console.log(
            "Recognized:",
            command
        );

        try{

            const response =
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })
                    }
                );

            const data =
                await response.json();

            if(
                !response.ok ||
                !data.success
            ){

                console.error(
                    data.message ||
                    "Song not found"
                );

                return;
            }

            youtubePlayer.src =
                data.url;

            player.style.display =
                "block";

        }catch(error){

            console.error(
                "Backend error:",
                error
            );

        }
    };

    recognition.onerror=event=>{

        console.error(
            "Mic error:",
            event.error
        );

        mic.classList.remove(
            "listening"
        );
    };

    recognition.onend=()=>{

        mic.classList.remove(
            "listening"
        );

    };
}

</script>

</body>
</html>
