<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miuh AI</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            margin: 0;
        }

        body {
            min-height: 100vh;
            overflow: hidden;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: "Segoe UI", Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(255, 0, 45, 0.22) 0%,
                    rgba(130, 0, 30, 0.10) 24%,
                    transparent 48%
                ),
                radial-gradient(
                    circle at 12% 50%,
                    rgba(180, 0, 35, 0.12),
                    transparent 32%
                ),
                radial-gradient(
                    circle at 88% 50%,
                    rgba(180, 0, 35, 0.12),
                    transparent 32%
                ),
                linear-gradient(
                    135deg,
                    #010102 0%,
                    #090205 48%,
                    #020203 100%
                );

            color: white;
        }

        /* =========================
           BACKGROUND
        ========================== */

        .background-glow {
            position: fixed;
            left: 50%;
            top: 50%;

            width: 650px;
            height: 650px;

            transform: translate(-50%, -50%);

            border-radius: 50%;

            background: rgba(255, 0, 45, 0.08);

            filter: blur(110px);

            pointer-events: none;
            z-index: 0;
        }

        .grid {
            position: fixed;
            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                );

            background-size: 60px 60px;

            mask-image: linear-gradient(
                to bottom,
                transparent,
                black 20%,
                black 80%,
                transparent
            );

            pointer-events: none;
            z-index: 0;
        }

        /* =========================
           YOUTUBE LOGO
        ========================== */

        .youtube-logo {
            position: fixed;

            top: 28px;
            left: 32px;

            display: flex;
            align-items: center;
            gap: 10px;

            color: white;

            font-size: 23px;
            font-weight: 700;
            letter-spacing: -0.5px;

            z-index: 10;
        }

        .youtube-icon {
            position: relative;

            width: 40px;
            height: 28px;

            border-radius: 8px;

            background: #ff0033;

            box-shadow:
                0 0 18px rgba(255, 0, 45, 0.30);
        }

        .youtube-icon::after {
            content: "";

            position: absolute;

            left: 15px;
            top: 7px;

            border-left: 11px solid white;
            border-top: 7px solid transparent;
            border-bottom: 7px solid transparent;
        }

        /* =========================
           MIUH AI
        ========================== */

        .brand {
            position: fixed;

            top: 30px;
            left: 50%;

            transform: translateX(-50%);

            z-index: 10;

            font-size: 22px;
            font-weight: 700;
            letter-spacing: 0.5px;

            color: white;

            text-shadow:
                0 0 16px rgba(255, 0, 45, 0.25);
        }

        .brand span {
            color: #ff1744;
        }

        /* =========================
           MAIN AREA
        ========================== */

        .main {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            z-index: 2;
        }

        /* =========================
           MICROPHONE
        ========================== */

        .voice-area {
            position: relative;

            width: 350px;
            height: 350px;

            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Outer rings */

        .ring {
            position: absolute;

            border-radius: 50%;

            border: 1px solid
                rgba(255, 30, 75, 0.30);

            pointer-events: none;
        }

        .ring-1 {
            width: 340px;
            height: 340px;

            animation:
                rotate 12s linear infinite;
        }

        .ring-2 {
            width: 290px;
            height: 290px;

            border-color:
                rgba(255, 50, 90, 0.34);

            animation:
                rotate-reverse 9s linear infinite;
        }

        .ring-3 {
            width: 240px;
            height: 240px;

            border-color:
                rgba(255, 0, 45, 0.45);

            animation:
                pulse-ring 2.2s ease-in-out infinite;
        }

        /* Microphone button */

        .mic {
            position: relative;

            width: 135px;
            height: 135px;

            border: none;
            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 35% 25%,
                    #ff8da0 0%,
                    #ff365b 30%,
                    #e40038 62%,
                    #680017 100%
                );

            cursor: pointer;

            z-index: 5;

            box-shadow:
                0 0 0 8px
                    rgba(255, 0, 45, 0.05),

                0 0 35px
                    rgba(255, 0, 45, 0.50),

                0 0 80px
                    rgba(255, 0, 45, 0.22),

                inset 0 0 25px
                    rgba(255, 255, 255, 0.10);

            transition:
                transform 0.22s ease,
                box-shadow 0.3s ease;
        }

        .mic:hover {
            transform: scale(1.07);

            box-shadow:
                0 0 0 10px
                    rgba(255, 0, 45, 0.06),

                0 0 50px
                    rgba(255, 0, 45, 0.72),

                0 0 110px
                    rgba(255, 0, 45, 0.28),

                inset 0 0 30px
                    rgba(255, 255, 255, 0.14);
        }

        .mic:active {
            transform: scale(0.95);
        }

        .mic:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        /* White microphone SVG */

        .mic-icon {
            width: 64px;
            height: 64px;

            display: block;

            filter:
                drop-shadow(
                    0 0 7px
                    rgba(255,255,255,0.35)
                );

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }

        .mic:hover .mic-icon {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 13px
                    rgba(255,255,255,0.70)
                );
        }

        /* Listening */

        .voice-area.listening .mic {
            animation:
                listening-pulse 1.15s infinite;
        }

        .voice-area.listening .ring-1,
        .voice-area.listening .ring-2,
        .voice-area.listening .ring-3 {
            border-color:
                rgba(255, 50, 80, 0.72);
        }

        /* =========================
           WAVEFORM
        ========================== */

        .waveform {
            position: absolute;

            bottom: 32px;
            left: 50%;

            transform: translateX(-50%);

            display: flex;
            align-items: center;

            gap: 4px;

            z-index: 4;

            pointer-events: none;
        }

        .waveform span {
            width: 3px;
            height: 18px;

            border-radius: 4px;

            background:
                linear-gradient(
                    to top,
                    #ff0033,
                    #ff849c
                );

            animation:
                wave 1s ease-in-out infinite;
        }

        .waveform span:nth-child(1) {
            animation-delay: .1s;
        }

        .waveform span:nth-child(2) {
            animation-delay: .2s;
        }

        .waveform span:nth-child(3) {
            animation-delay: .3s;
        }

        .waveform span:nth-child(4) {
            animation-delay: .4s;
        }

        .waveform span:nth-child(5) {
            animation-delay: .5s;
        }

        .waveform span:nth-child(6) {
            animation-delay: .4s;
        }

        .waveform span:nth-child(7) {
            animation-delay: .3s;
        }

        .waveform span:nth-child(8) {
            animation-delay: .2s;
        }

        .waveform span:nth-child(9) {
            animation-delay: .1s;
        }

        /* =========================
           VIDEO PLAYER
        ========================== */

        .player {
            position: fixed;

            left: 50%;
            bottom: 30px;

            transform: translateX(-50%);

            width: min(560px, calc(100vw - 40px));

            display: none;

            z-index: 20;
        }

        .player iframe {
            display: block;

            width: 100%;
            height: 315px;

            border: 1px solid
                rgba(255, 40, 70, 0.30);

            border-radius: 16px;

            background: black;

            box-shadow:
                0 0 35px
                rgba(255, 0, 45, 0.15);
        }

        /* =========================
           HIDDEN TEXT ELEMENTS
        ========================== */

        #status,
        #song {
            display: none;
        }

        /* =========================
           ANIMATIONS
        ========================== */

        @keyframes listening-pulse {

            0% {
                box-shadow:
                    0 0 0 8px
                        rgba(255, 0, 45, 0.05),

                    0 0 35px
                        rgba(255, 0, 45, 0.50);
            }

            50% {
                box-shadow:
                    0 0 0 20px
                        rgba(255, 0, 45, 0.03),

                    0 0 65px
                        rgba(255, 0, 45, 0.90),

                    0 0 110px
                        rgba(255, 0, 45, 0.30);
            }

            100% {
                box-shadow:
                    0 0 0 8px
                        rgba(255, 0, 45, 0.05),

                    0 0 35px
                        rgba(255, 0, 45, 0.50);
            }
        }

        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: .45;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }

        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        @keyframes rotate-reverse {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }

        @keyframes wave {

            0%,
            100% {
                transform: scaleY(.5);
            }

            50% {
                transform: scaleY(1.8);
            }
        }

        /* =========================
           MOBILE
        ========================== */

        @media (max-width: 600px) {

            .youtube-logo {
                left: 20px;
                top: 20px;

                font-size: 20px;
            }

            .youtube-icon {
                width: 34px;
                height: 24px;
            }

            .brand {
                top: 22px;
                font-size: 18px;
            }

            .voice-area {
                width: 300px;
                height: 300px;
            }

            .ring-1 {
                width: 290px;
                height: 290px;
            }

            .ring-2 {
                width: 245px;
                height: 245px;
            }

            .ring-3 {
                width: 205px;
                height: 205px;
            }

            .mic {
                width: 115px;
                height: 115px;
            }

            .mic-icon {
                width: 55px;
                height: 55px;
            }

            .player {
                bottom: 15px;
            }

            .player iframe {
                height: 210px;
            }
        }
    </style>
</head>


<body>

    <!-- Background effects -->

    <div class="background-glow"></div>
    <div class="grid"></div>


    <!-- YouTube logo -->

    <div class="youtube-logo">

        <div class="youtube-icon"></div>

        <span>YouTube</span>

    </div>


    <!-- Miuh AI -->

    <div class="brand">

        Miuh <span>AI</span>

    </div>


    <!-- Main -->

    <main class="main">

        <div
            id="voiceArea"
            class="voice-area">

            <div class="ring ring-1"></div>

            <div class="ring ring-2"></div>

            <div class="ring ring-3"></div>


            <!-- White microphone -->

            <button
                id="mic"
                class="mic"
                aria-label="Start microphone">

                <svg
                    class="mic-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">

                    <!-- Microphone -->

                    <rect
                        x="8"
                        y="2"
                        width="8"
                        height="13"
                        rx="4"
                        fill="white"
                    />

                    <!-- Outer microphone arc -->

                    <path
                        d="M5 11C5 15.4183 7.68629 18 12 18C16.3137 18 19 15.4183 19 11"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <!-- Stand -->

                    <path
                        d="M12 18V22"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                    <!-- Base -->

                    <path
                        d="M9 22H15"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                </svg>

            </button>


            <!-- Audio waveform -->

            <div class="waveform">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    </main>


    <!-- Hidden functional elements -->

    <div id="status">
        Tap microphone
    </div>

    <div id="song"></div>


    <!-- YouTube player -->

    <div
        id="player"
        class="player">

        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media"
            allowfullscreen>
        </iframe>

    </div>


    <script>

        /* =========================
           ELEMENTS
        ========================== */

        const mic =
            document.getElementById("mic");

        const voiceArea =
            document.getElementById("voiceArea");

        const status =
            document.getElementById("status");

        const song =
            document.getElementById("song");

        const player =
            document.getElementById("player");

        const youtubePlayer =
            document.getElementById("youtubePlayer");


        /* =========================
           SPEECH RECOGNITION
        ========================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            console.error(
                "Speech recognition is not supported in this browser."
            );

            mic.disabled = true;

        } else {

            const recognition =
                new SpeechRecognition();


            recognition.lang =
                "en-US";

            recognition.continuous =
                false;

            recognition.interimResults =
                false;


            /* =========================
               MICROPHONE CLICK
            ========================== */

            mic.addEventListener(
                "click",
                () => {

                    try {

                        recognition.start();

                        voiceArea.classList.add(
                            "listening"
                        );

                        console.log(
                            "Listening..."
                        );

                    } catch (error) {

                        console.error(
                            "Recognition start error:",
                            error
                        );

                    }

                }
            );


            /* =========================
               SPEECH RESULT
            ========================== */

            recognition.onresult =
                async (event) => {

                    const command =
                        event.results[0][0]
                            .transcript
                            .trim();


                    console.log(
                        "Recognized:",
                        command
                    );


                    try {

                        const response =
                            await fetch(
                                "/youtube/play",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            command:
                                                command
                                        })
                                }
                            );


                        const data =
                            await response.json();


                        console.log(
                            "Backend response:",
                            data
                        );


                        /* =========================
                           ERROR RESPONSE
                        ========================== */

                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            console.error(
                                data.message ||
                                "Song not found"
                            );

                            return;
                        }


                        /* =========================
                           PLAY INSIDE PAGE
                        ========================== */

                        youtubePlayer.src =
                            data.url;

                        player.style.display =
                            "block";


                        song.textContent =
                            data.query;


                        console.log(
                            "Playing:",
                            data.query
                        );

                    } catch (error) {

                        console.error(
                            "Backend error:",
                            error
                        );

                    }

                };


            /* =========================
               SPEECH ERROR
            ========================== */

            recognition.onerror =
                (event) => {

                    console.error(
                        "Speech recognition error:",
                        event.error
                    );

                    voiceArea.classList.remove(
                        "listening"
                    );

                };


            /* =========================
               SPEECH END
            ========================== */

            recognition.onend =
                () => {

                    voiceArea.classList.remove(
                        "listening"
                    );

                };

        }

    </script>

</body>

</html>
