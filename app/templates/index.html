<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Miuh AI</title>

    <style>
        /* =========================================================
           RESET
        ========================================================== */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }


        /* =========================================================
           BODY / BACKGROUND
        ========================================================== */

        body {
            min-height: 100vh;
            overflow: hidden;

            font-family:
                "Segoe UI",
                Arial,
                sans-serif;

            color: white;

            background:
                radial-gradient(
                    circle at 50% 48%,
                    rgba(255, 0, 45, 0.22) 0%,
                    rgba(130, 0, 30, 0.11) 24%,
                    transparent 48%
                ),

                radial-gradient(
                    circle at 12% 50%,
                    rgba(180, 0, 35, 0.13),
                    transparent 32%
                ),

                radial-gradient(
                    circle at 88% 50%,
                    rgba(180, 0, 35, 0.13),
                    transparent 32%
                ),

                linear-gradient(
                    135deg,
                    #010102 0%,
                    #0a0206 48%,
                    #020203 100%
                );
        }


        /* =========================================================
           BACKGROUND GLOW
        ========================================================== */

        .background-glow {
            position: fixed;

            left: 50%;
            top: 50%;

            width: 700px;
            height: 700px;

            transform:
                translate(-50%, -50%);

            border-radius: 50%;

            background:
                rgba(255, 0, 45, 0.08);

            filter: blur(110px);

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================================
           BACKGROUND GRID
        ========================================================== */

        .grid {
            position: fixed;

            inset: 0;

            background-image:
                linear-gradient(
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255, 255, 255, 0.018) 1px,
                    transparent 1px
                );

            background-size: 60px 60px;

            mask-image:
                linear-gradient(
                    to bottom,
                    transparent,
                    black 20%,
                    black 80%,
                    transparent
                );

            pointer-events: none;

            z-index: 0;
        }


        /* =========================================================
           YOUTUBE LOGO
        ========================================================== */

        .youtube-logo {
            position: fixed;

            left: 32px;
            top: 28px;

            display: flex;
            align-items: center;

            gap: 10px;

            color: white;

            font-size: 23px;
            font-weight: 700;

            letter-spacing: -0.5px;

            z-index: 30;
        }


        .youtube-icon {
            position: relative;

            width: 40px;
            height: 28px;

            border-radius: 8px;

            background: #ff0033;

            box-shadow:
                0 0 20px
                rgba(255, 0, 45, 0.30);
        }


        .youtube-icon::after {
            content: "";

            position: absolute;

            left: 15px;
            top: 7px;

            border-left:
                11px solid white;

            border-top:
                7px solid transparent;

            border-bottom:
                7px solid transparent;
        }


        /* =========================================================
           MIUH AI LOGO
        ========================================================== */

        .brand {
            position: fixed;

            left: 50%;
            top: 29px;

            transform:
                translateX(-50%);

            font-size: 22px;
            font-weight: 700;

            letter-spacing: 0.5px;

            color: white;

            text-shadow:
                0 0 18px
                rgba(255, 0, 45, 0.25);

            z-index: 30;
        }


        .brand span {
            color: #ff1744;
        }


        /* =========================================================
           MAIN AREA
        ========================================================== */

        .main {
            position: relative;

            width: 100%;
            height: 100vh;

            display: flex;

            align-items: center;
            justify-content: center;

            z-index: 5;
        }


        /* =========================================================
           VOICE AREA
        ========================================================== */

        .voice-area {
            position: relative;

            width: 370px;
            height: 370px;

            display: flex;

            align-items: center;
            justify-content: center;

            transition:
                transform 0.5s ease;
        }


        /*
           When video is visible, move
           microphone slightly left.
        */

        .main.video-visible .voice-area {
            transform:
                translateX(-250px);
        }


        /* =========================================================
           OUTER RINGS
        ========================================================== */

        .ring {
            position: absolute;

            border-radius: 50%;

            border:
                1px solid
                rgba(255, 30, 75, 0.32);

            pointer-events: none;
        }


        .ring-1 {
            width: 350px;
            height: 350px;

            animation:
                rotate 12s linear infinite;
        }


        .ring-2 {
            width: 300px;
            height: 300px;

            border-color:
                rgba(255, 45, 85, 0.38);

            animation:
                rotate-reverse
                9s
                linear
                infinite;
        }


        .ring-3 {
            width: 250px;
            height: 250px;

            border-color:
                rgba(255, 0, 45, 0.52);

            animation:
                pulse-ring
                2.2s
                ease-in-out
                infinite;
        }


        /* =========================================================
           MICROPHONE
        ========================================================== */

        .mic {
            position: relative;

            width: 140px;
            height: 140px;

            border: none;

            border-radius: 50%;

            display: flex;
            align-items: center;
            justify-content: center;

            background:
                radial-gradient(
                    circle at 35% 24%,
                    #ff9aaa,
                    #ff365b 35%,
                    #e30038 65%,
                    #690018 100%
                );

            cursor: pointer;

            z-index: 10;

            box-shadow:
                0 0 0 8px
                rgba(255, 0, 45, 0.055),

                0 0 40px
                rgba(255, 0, 45, 0.55),

                0 0 90px
                rgba(255, 0, 45, 0.23),

                inset 0 0 28px
                rgba(255, 255, 255, 0.12);

            transition:
                transform 0.22s ease,
                box-shadow 0.3s ease;
        }


        .mic:hover {
            transform: scale(1.07);

            box-shadow:
                0 0 0 11px
                rgba(255, 0, 45, 0.06),

                0 0 55px
                rgba(255, 0, 45, 0.75),

                0 0 110px
                rgba(255, 0, 45, 0.28),

                inset 0 0 30px
                rgba(255, 255, 255, 0.14);
        }


        .mic:active {
            transform: scale(0.95);
        }


        .mic:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }


        /* =========================================================
           WHITE MICROPHONE SVG
        ========================================================== */

        .mic-icon {
            width: 66px;
            height: 66px;

            display: block;

            filter:
                drop-shadow(
                    0 0 8px
                    rgba(255,255,255,0.42)
                );

            transition:
                transform 0.2s ease,
                filter 0.2s ease;
        }


        .mic:hover .mic-icon {
            transform: scale(1.08);

            filter:
                drop-shadow(
                    0 0 15px
                    rgba(255,255,255,0.72)
                );
        }


        /* =========================================================
           LISTENING STATE
        ========================================================== */

        .voice-area.listening .mic {
            animation:
                listening-pulse
                1.1s
                infinite;
        }


        .voice-area.listening .ring-1,
        .voice-area.listening .ring-2,
        .voice-area.listening .ring-3 {
            border-color:
                rgba(255, 50, 85, 0.72);
        }


        /* =========================================================
           WAVEFORM
        ========================================================== */

        .waveform {
            position: absolute;

            bottom: 35px;

            left: 50%;

            transform:
                translateX(-50%);

            display: flex;

            align-items: center;

            gap: 4px;

            pointer-events: none;

            z-index: 11;
        }


        .waveform span {
            width: 3px;
            height: 18px;

            border-radius: 4px;

            background:
                linear-gradient(
                    to top,
                    #ff0033,
                    #ff849c
                );

            animation:
                wave
                1s
                ease-in-out
                infinite;
        }


        .waveform span:nth-child(1) {
            animation-delay: .1s;
        }

        .waveform span:nth-child(2) {
            animation-delay: .2s;
        }

        .waveform span:nth-child(3) {
            animation-delay: .3s;
        }

        .waveform span:nth-child(4) {
            animation-delay: .4s;
        }

        .waveform span:nth-child(5) {
            animation-delay: .5s;
        }

        .waveform span:nth-child(6) {
            animation-delay: .4s;
        }

        .waveform span:nth-child(7) {
            animation-delay: .3s;
        }

        .waveform span:nth-child(8) {
            animation-delay: .2s;
        }

        .waveform span:nth-child(9) {
            animation-delay: .1s;
        }


        /* =========================================================
           VIDEO PLAYER
        ========================================================== */

        .player {
            position: fixed;

            left: calc(50% + 65px);
            top: 50%;

            transform:
                translateY(-50%);

            width: 520px;

            display: none;

            z-index: 20;

            animation:
                videoIn
                0.45s
                ease
                forwards;
        }


        .player iframe {
            display: block;

            width: 100%;
            height: 293px;

            border:
                1px solid
                rgba(255, 40, 70, 0.38);

            border-radius: 18px;

            background: #000;

            box-shadow:
                0 0 35px
                rgba(255, 0, 45, 0.18),

                0 20px 60px
                rgba(0, 0, 0, 0.60);
        }


        /* =========================================================
           ANIMATIONS
        ========================================================== */

        @keyframes listening-pulse {

            0% {
                box-shadow:
                    0 0 0 8px
                    rgba(255, 0, 45, 0.05),

                    0 0 35px
                    rgba(255, 0, 45, 0.50);
            }

            50% {
                box-shadow:
                    0 0 0 20px
                    rgba(255, 0, 45, 0.03),

                    0 0 70px
                    rgba(255, 0, 45, 0.90),

                    0 0 120px
                    rgba(255, 0, 45, 0.30);
            }

            100% {
                box-shadow:
                    0 0 0 8px
                    rgba(255, 0, 45, 0.05),

                    0 0 35px
                    rgba(255, 0, 45, 0.50);
            }
        }


        @keyframes pulse-ring {

            0%,
            100% {
                transform: scale(1);
                opacity: .45;
            }

            50% {
                transform: scale(1.08);
                opacity: 1;
            }
        }


        @keyframes rotate {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }


        @keyframes rotate-reverse {

            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(-360deg);
            }
        }


        @keyframes wave {

            0%,
            100% {
                transform: scaleY(.5);
            }

            50% {
                transform: scaleY(1.8);
            }
        }


        @keyframes videoIn {

            from {
                opacity: 0;
                transform:
                    translate(40px, -50%);
            }

            to {
                opacity: 1;
                transform:
                    translate(0, -50%);
            }
        }


        /* =========================================================
           HIDDEN ELEMENTS
        ========================================================== */

        #status,
        #song {
            display: none;
        }


        /* =========================================================
           MOBILE / TABLET
        ========================================================== */

        @media (max-width: 1100px) {

            body {
                overflow-y: auto;
            }


            .main {
                min-height: 100vh;
                height: auto;

                padding:
                    100px 20px
                    350px;
            }


            .main.video-visible {
                align-items: flex-start;
            }


            .main.video-visible .voice-area {
                transform: none;
            }


            .player {
                left: 50%;
                top: auto;
                bottom: 25px;

                transform:
                    translateX(-50%);

                width:
                    min(
                        560px,
                        calc(100vw - 40px)
                    );
            }


            .player iframe {
                height: 300px;
            }
        }


        @media (max-width: 600px) {

            .youtube-logo {
                top: 20px;
                left: 20px;

                font-size: 19px;
            }


            .youtube-icon {
                width: 34px;
                height: 24px;
            }


            .brand {
                top: 22px;

                font-size: 18px;
            }


            .voice-area {
                width: 300px;
                height: 300px;
            }


            .ring-1 {
                width: 290px;
                height: 290px;
            }


            .ring-2 {
                width: 245px;
                height: 245px;
            }


            .ring-3 {
                width: 205px;
                height: 205px;
            }


            .mic {
                width: 115px;
                height: 115px;
            }


            .mic-icon {
                width: 55px;
                height: 55px;
            }


            .waveform {
                bottom: 29px;
            }


            .player {
                bottom: 15px;

                width:
                    calc(100vw - 30px);
            }


            .player iframe {
                height: 210px;
            }
        }

    </style>
</head>


<body>


    <!-- =========================================================
         BACKGROUND
    ========================================================== -->

    <div class="background-glow"></div>

    <div class="grid"></div>


    <!-- =========================================================
         YOUTUBE LOGO
    ========================================================== -->

    <div class="youtube-logo">

        <div class="youtube-icon"></div>

        <span>YouTube</span>

    </div>


    <!-- =========================================================
         MIUH AI
    ========================================================== -->

    <div class="brand">
        Miuh <span>AI</span>
    </div>


    <!-- =========================================================
         MAIN
    ========================================================== -->

    <main
        id="main"
        class="main">


        <!-- =====================================================
             MICROPHONE
        ====================================================== -->

        <div
            id="voiceArea"
            class="voice-area">


            <!-- Rings -->

            <div class="ring ring-1"></div>

            <div class="ring ring-2"></div>

            <div class="ring ring-3"></div>


            <!-- Microphone -->

            <button
                id="mic"
                class="mic"
                aria-label="Start voice search">


                <!-- WHITE MICROPHONE ICON -->

                <svg
                    class="mic-icon"
                    viewBox="0 0 24 24"
                    fill="none"
                    xmlns="http://www.w3.org/2000/svg">


                    <rect
                        x="8"
                        y="2"
                        width="8"
                        height="13"
                        rx="4"
                        fill="white"
                    />


                    <path
                        d="M5 11C5 15.4183 7.68629 18 12 18C16.3137 18 19 15.4183 19 11"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />


                    <path
                        d="M12 18V22"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />


                    <path
                        d="M9 22H15"
                        stroke="white"
                        stroke-width="2"
                        stroke-linecap="round"
                    />

                </svg>

            </button>


            <!-- Waveform -->

            <div class="waveform">

                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>
                <span></span>

            </div>

        </div>

    </main>


    <!-- =========================================================
         HIDDEN FUNCTIONAL ELEMENTS
    ========================================================== -->

    <div id="status">
        Tap microphone
    </div>

    <div id="song"></div>


    <!-- =========================================================
         YOUTUBE VIDEO
    ========================================================== -->

    <div
        id="player"
        class="player">

        <iframe
            id="youtubePlayer"
            title="YouTube video"
            allow="
                autoplay;
                encrypted-media;
                picture-in-picture;
                web-share
            "
            allowfullscreen>
        </iframe>

    </div>


    <!-- =========================================================
         JAVASCRIPT
    ========================================================== -->

    <script>

        /* =====================================================
           ELEMENTS
        ====================================================== */

        const mic =
            document.getElementById("mic");

        const main =
            document.getElementById("main");

        const voiceArea =
            document.getElementById("voiceArea");

        const status =
            document.getElementById("status");

        const song =
            document.getElementById("song");

        const player =
            document.getElementById("player");

        const youtubePlayer =
            document.getElementById("youtubePlayer");


        /* =====================================================
           SPEECH API
        ====================================================== */

        const SpeechRecognition =
            window.SpeechRecognition ||
            window.webkitSpeechRecognition;


        if (!SpeechRecognition) {

            console.error(
                "Speech recognition is not supported in this browser."
            );

            mic.disabled = true;

        } else {


            const recognition =
                new SpeechRecognition();


            recognition.lang =
                "en-US";


            recognition.continuous =
                false;


            recognition.interimResults =
                false;


            /* =================================================
               MICROPHONE CLICK
            ================================================== */

            mic.addEventListener(
                "click",
                () => {

                    try {

                        recognition.start();

                        voiceArea.classList.add(
                            "listening"
                        );

                        console.log(
                            "Listening..."
                        );

                    } catch (error) {

                        console.error(
                            "Could not start speech recognition:",
                            error
                        );

                    }

                }
            );


            /* =================================================
               SPEECH RESULT
            ================================================== */

            recognition.onresult =
                async (event) => {

                    const command =
                        event.results[0][0]
                            .transcript
                            .trim();


                    console.log(
                        "Recognized:",
                        command
                    );


                    status.textContent =
                        "Searching...";


                    song.textContent =
                        command;


                    try {

                        const response =
                            await fetch(
                                "/youtube/play",
                                {
                                    method: "POST",

                                    headers: {
                                        "Content-Type":
                                            "application/json"
                                    },

                                    body:
                                        JSON.stringify({
                                            command:
                                                command
                                        })
                                }
                            );


                        /* =====================================
                           RESPONSE
                        ====================================== */

                        const data =
                            await response.json();


                        console.log(
                            "Backend response:",
                            data
                        );


                        /* =====================================
                           FAILED
                        ====================================== */

                        if (
                            !response.ok ||
                            !data.success
                        ) {

                            status.textContent =
                                data.message ||
                                "Song not found";

                            return;
                        }


                        /* =====================================
                           SUCCESS
                        ====================================== */

                        status.textContent =
                            "Playing";


                        song.textContent =
                            data.query;


                        /*
                         * Your Flask backend returns
                         * the YouTube embed URL.
                         *
                         * Example:
                         *
                         * https://www.youtube.com/embed/VIDEO_ID
                         */

                        youtubePlayer.src =
                            data.url;


                        /*
                         * Show video.
                         */

                        player.style.display =
                            "block";


                        /*
                         * Move microphone slightly
                         * to the left so video fits
                         * naturally on the right.
                         */

                        main.classList.add(
                            "video-visible"
                        );


                    } catch (error) {

                        console.error(
                            "Backend error:",
                            error
                        );


                        status.textContent =
                            "Could not connect to server";

                    }

                };


            /* =================================================
               SPEECH ERROR
            ================================================== */

            recognition.onerror =
                (event) => {

                    console.error(
                        "Speech recognition error:",
                        event.error
                    );


                    voiceArea.classList.remove(
                        "listening"
                    );


                    if (
                        event.error ===
                        "not-allowed"
                    ) {

                        console.error(
                            "Microphone permission denied."
                        );

                    }

                };


            /* =================================================
               SPEECH END
            ================================================== */

            recognition.onend =
                () => {

                    voiceArea.classList.remove(
                        "listening"
                    );

                };

        }

    </script>

</body>

</html>
