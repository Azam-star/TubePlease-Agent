<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Miuh AI</title>

<style>
*{box-sizing:border-box}

body{
    margin:0;
    height:100vh;
    overflow:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    font-family:Arial,sans-serif;
    color:#fff;
    background:
        radial-gradient(circle at 50% 45%,#43000f,transparent 35%),
        radial-gradient(circle at 85% 20%,#300025,transparent 25%),
        radial-gradient(circle at 15% 80%,#22000b,transparent 28%),
        linear-gradient(135deg,#010102,#0d0208,#020203);
}

.youtube{
    position:fixed;
    top:25px;
    left:30px;
    display:flex;
    align-items:center;
    gap:9px;
    font-size:22px;
    font-weight:bold;
    z-index:10;
}

.youtube-icon{
    width:38px;
    height:26px;
    background:#ff0033;
    border-radius:7px;
    position:relative;
    box-shadow:0 0 18px #ff003355;
}

.youtube-icon:after{
    content:"";
    position:absolute;
    left:14px;
    top:6px;
    border-left:11px solid #fff;
    border-top:7px solid transparent;
    border-bottom:7px solid transparent;
}

.brand{
    position:fixed;
    top:27px;
    left:50%;
    transform:translateX(-50%);
    font-size:22px;
    font-weight:bold;
    z-index:10;
}

.brand span{
    color:#ff1744;
}

.gmail{
    position:fixed;
    top:25px;
    right:30px;
    display:flex;
    align-items:center;
    gap:9px;
    font-size:22px;
    font-weight:bold;
    z-index:10;
}

.gmail-icon{
    width:38px;
    height:28px;
    background:#fff;
    border-radius:6px;
    position:relative;
    overflow:hidden;
}

.gmail-icon:before{
    content:"";
    position:absolute;
    inset:0;
    background:
        linear-gradient(
            35deg,
            transparent 42%,
            #ea4335 43%,
            #ea4335 53%,
            transparent 54%
        ),
        linear-gradient(
            -35deg,
            transparent 42%,
            #c5221f 43%,
            #c5221f 53%,
            transparent 54%
        );
}

.gmail-icon:after{
    content:"";
    position:absolute;
    left:0;
    top:0;
    width:100%;
    height:7px;
    background:#ea4335;
}

.main{
    width:100%;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:90px;
    padding:80px 50px 40px;
}

.voice{
    width:320px;
    height:320px;
    position:relative;
    display:grid;
    place-items:center;
    border-radius:50%;
    background:
        radial-gradient(circle,
        rgba(60,0,15,.5),
        rgba(5,0,4,.92));
    box-shadow:
        0 0 35px rgba(255,0,45,.25),
        0 0 90px rgba(255,0,45,.12);
    flex-shrink:0;
}

.ring{
    position:absolute;
    border:1px solid #ff174455;
    border-radius:50%;
    animation:pulse 2s infinite;
}

.r1{width:300px;height:300px}
.r2{width:250px;height:250px;animation-delay:.3s}
.r3{width:200px;height:200px;animation-delay:.6s}

#mic{
    width:135px;
    height:135px;
    border:0;
    border-radius:50%;
    cursor:pointer;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at 35% 25%,
        #ff92a4,#ff1744 55%,#650016);
    box-shadow:0 0 35px #ff174477;
    z-index:2;
    transition:.2s;
}

#mic:hover{
    transform:scale(1.07);
    box-shadow:0 0 55px #ff1744cc;
}

#mic.listening{
    animation:listen 1s infinite;
}

.mic-icon{
    width:60px;
    height:60px;
}

.result{
    width:520px;
    min-height:280px;
    display:none;
    padding:18px;
    border:1px solid #ff174455;
    border-radius:18px;
    background:rgba(8,3,7,.82);
    box-shadow:0 0 35px #ff174422;
}

.player iframe{
    width:100%;
    height:280px;
    display:block;
    border:0;
    border-radius:12px;
    background:#000;
}

.editor{
    text-align:left;
}

.recipient{
    color:#aaa;
    font-size:13px;
    margin-bottom:10px;
}

input,
textarea{
    width:100%;
    margin:6px 0;
    padding:12px;
    background:#10080c;
    color:white;
    border:1px solid #ff174433;
    border-radius:8px;
    outline:none;
}

textarea{
    height:150px;
    resize:none;
}

.action{
    padding:10px 15px;
    margin:6px 4px 0 0;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

.primary{
    background:#ff1744;
    color:#fff;
}

.secondary{
    background:#333;
    color:#fff;
}

.status{
    position:fixed;
    bottom:25px;
    left:50%;
    transform:translateX(-50%);
    color:#aaa;
    font-size:13px;
}

.command{
    display:none;
}

@keyframes pulse{
    50%{
        transform:scale(1.08);
        opacity:.65;
    }
}

@keyframes listen{
    50%{
        box-shadow:
            0 0 0 15px #ff174422,
            0 0 70px #ff1744;
    }
}

@media(max-width:1000px){

    body{
        overflow:auto;
    }

    .main{
        flex-direction:column;
        gap:25px;
        padding-top:100px;
    }

    .result{
        width:min(520px,90vw);
    }

    .youtube,
    .gmail{
        font-size:18px;
    }

    .youtube{left:15px}
    .gmail{right:15px}
}

@media(max-width:600px){

    .voice{
        width:280px;
        height:280px;
    }

    .r1{width:260px;height:260px}
    .r2{width:220px;height:220px}
    .r3{width:180px;height:180px}

    #mic{
        width:120px;
        height:120px;
    }

    .mic-icon{
        width:55px;
        height:55px;
    }

    .result{
        width:92vw;
    }

    .player iframe{
        height:230px;
    }
}
</style>
</head>

<body>

<div class="youtube">
    <div class="youtube-icon"></div>
    YouTube
</div>

<div class="brand">
    Miuh <span>AI</span>
</div>

<div class="gmail">
    <div class="gmail-icon"></div>
    Gmail
</div>

<div class="main">

    <div id="voice" class="voice">

        <div class="ring r1"></div>
        <div class="ring r2"></div>
        <div class="ring r3"></div>

        <button id="mic" aria-label="Start voice command">

            <svg
                class="mic-icon"
                viewBox="0 0 24 24"
                fill="none">

                <rect
                    x="8"
                    y="2"
                    width="8"
                    height="13"
                    rx="4"
                    fill="white"/>

                <path
                    d="M5 11C5 15 8 18 12 18C16 18 19 15 19 11"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M12 18V22"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

                <path
                    d="M9 22H15"
                    stroke="white"
                    stroke-width="2"
                    stroke-linecap="round"/>

            </svg>

        </button>

    </div>

    <div id="youtubeResult" class="result player">

        <iframe
            id="youtubePlayer"
            allow="autoplay; encrypted-media; picture-in-picture"
            allowfullscreen>
        </iframe>

    </div>

    <div id="gmailResult" class="result editor">

        <div id="recipient" class="recipient"></div>

        <input
            id="subject"
            placeholder="Email subject">

        <textarea
            id="body"
            placeholder="Email body"></textarea>

        <button
            id="open"
            class="action primary">
            Open in Gmail
        </button>

        <button
            id="regen"
            class="action secondary">
            Regenerate
        </button>

    </div>

</div>

<div id="status" class="status">
    Tap microphone
</div>

<div id="command" class="command"></div>

<script>

const $ = id => document.getElementById(id);

const mic = $("mic");
const voice = $("voice");
const status = $("status");
const commandBox = $("command");

const youtubeResult = $("youtubeResult");
const youtubePlayer = $("youtubePlayer");

const gmailResult = $("gmailResult");
const recipient = $("recipient");
const subject = $("subject");
const body = $("body");

const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

let recognition;
let listening = false;
let lastCommand = "";
let emailGenerated = false;
let generatingEmail = false;

if(!SR){

    status.textContent =
        "Speech recognition unavailable";

    mic.disabled = true;

}else{

    recognition = new SR();

    recognition.lang = "en-US";
    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.onstart = () => {

        listening = true;

        mic.classList.add("listening");

        status.textContent =
            "Listening...";
    };

    recognition.onend = () => {

        listening = false;

        mic.classList.remove("listening");
    };

    recognition.onerror = e => {

        listening = false;

        mic.classList.remove("listening");

        status.textContent =
            "Voice error: " + e.error;
    };

    recognition.onresult = e => {

        const text =
            e.results[0][0]
            .transcript
            .trim();

        if(!text){

            status.textContent =
                "No command detected";

            return;
        }

        lastCommand = text;
        commandBox.textContent = text;

        processCommand(text);
    };

    mic.onclick = () => {

        if(listening) return;

        try{

            recognition.start();

        }catch(e){

            console.log(e);

        }
    };
}

function isGmail(command){

    return (
        /\bcreate\b/i.test(command) &&
        /\bemail\b/i.test(command)
    );
}

function isYouTube(command){

    return (
        /\bplay\b/i.test(command) ||
        /\bsong\b/i.test(command)
    );
}

async function processCommand(command){

    youtubeResult.style.display = "none";
    gmailResult.style.display = "none";

    const gmail = isGmail(command);
    const youtube = isYouTube(command);

    if(gmail){

        if(generatingEmail){

            status.textContent =
                "Email is already being generated...";

            return;
        }

        if(
            emailGenerated &&
            command === lastCommand
        ){

            status.textContent =
                "Email already generated.";

            gmailResult.style.display =
                "block";

            return;
        }

        generatingEmail = true;

        status.textContent =
            "Generating email...";

        try{

            const response =
                await fetch(
                    "/agent",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })
                    }
                );

            const data =
                await response.json();

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "Email request failed"
                );
            }

            showEmail(data);

            emailGenerated = true;

        }catch(error){

            console.error(error);

            status.textContent =
                error.message ||
                "Email generation failed";

        }finally{

            generatingEmail = false;
        }

        return;
    }

    if(youtube){

        status.textContent =
            "Finding song...";

        try{

            const response =
                await fetch(
                    "/youtube/play",
                    {
                        method:"POST",

                        headers:{
                            "Content-Type":
                                "application/json"
                        },

                        body:
                            JSON.stringify({
                                command:command
                            })
                    }
                );

            const data =
                await response.json();

            if(
                !response.ok ||
                !data.success
            ){

                throw new Error(
                    data.message ||
                    "YouTube request failed"
                );
            }

            youtubePlayer.src =
                data.url;

            youtubeResult.style.display =
                "block";

            status.textContent =
                "Playing";

        }catch(error){

            console.error(error);

            status.textContent =
                error.message ||
                "YouTube request failed";
        }

        return;
    }

    status.textContent =
        "Say 'play a song' or 'create an email'.";
}

function showEmail(data){

    recipient.dataset.email =
        data.recipient || "";

    recipient.textContent =
        data.recipient
        ? "To: " + data.recipient
        : "Recipient not specified";

    subject.value =
        data.subject || "";

    body.value =
        data.body || "";

    gmailResult.style.display =
        "block";

    status.textContent =
        "Email ready. Review or edit it.";
}

$("open").onclick = () => {

    const url =
        "https://mail.google.com/mail/u/0/?" +
        new URLSearchParams({

            view:"cm",
            fs:"1",

            to:
                recipient.dataset.email || "",

            su:
                subject.value,

            body:
                body.value
        });

    const win =
        window.open(
            url,
            "MiuhGmail"
        );

    if(!win){

        status.textContent =
            "Please allow popups for this site.";
    }
};

$("regen").onclick = () => {

    if(!lastCommand){

        status.textContent =
            "Create an email first.";

        return;
    }

    emailGenerated = false;

    processCommand(lastCommand);
};

</script>

</body>
</html>
